<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Architect</title>
    <link rel="stylesheet" href="/chat/chat.css">
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        }
        #layout {
            display: flex;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
        }
        #canvas {
            flex: 1 1 auto;
            position: relative;
            height: 100%;
            min-width: 0;
        }
        #sidebar {
            flex: 0 0 400px;
            height: 100%;
            min-width: 0;
            display: flex;
        }
    </style>
    <script>
        window.addEventListener('error', function (event) {
            console.error('Global Error in HTML:', event.error || event.message);
        });
    </script>
</head>

<body>
    <div id="layout">
        <div id="canvas"></div>
        <div id="sidebar"></div>
    </div>
    <script type="module" src="/chat/chat.js"></script>
</body>

</html>
