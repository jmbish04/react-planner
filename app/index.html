<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Architect</title>
    <link rel="stylesheet" href="/chat/chat.css">
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        }
        #layout {
            position: relative;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
        }
        /* react-planner canvas fills the whole screen */
        #canvas {
            position: absolute;
            inset: 0;
            height: 100%;
            width: 100%;
        }
        /* sidebar bundle only holds the floating launcher button (bottom-right);
           the assistant-ui modal itself portals to <body> and hovers over the canvas */
        #sidebar {
            position: fixed;
            right: 24px;
            bottom: 24px;
            z-index: 2000;
        }
    </style>
    <script>
        window.addEventListener('error', function (event) {
            console.error('Global Error in HTML:', event.error || event.message);
        });
    </script>
</head>

<body>
    <div id="layout">
        <div id="canvas"></div>
        <div id="sidebar"></div>
    </div>
    <script type="module" src="/chat/chat.js"></script>
</body>

</html>
